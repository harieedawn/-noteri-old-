<style>

:root{--ff:"Google Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;--bg:#F6F0E6;--sf:#FFFAF1;--sa:#EDE4D3;--ol:#D9CDB8;--tx:#2E2822;--mu:#7B6F61;--pr:#C4673F;--pr2:#E39A5B;--on:#FFF8EE;--dg:#C0463B;--desk:#E4DAC7;--gl:rgba(255,250,241,.8);--sp:cubic-bezier(.34,1.56,.64,1);--ez:cubic-bezier(.2,.8,.2,1);--sh:0 1px 2px #2e28220d,0 8px 22px #2e282214;--sh2:0 2px 6px #2e282214,0 18px 38px #2e282224}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

svg{display:block}

.btn,.chip,.tile,.opt,.bt,.mb,.sbt,.fab,#top .ib{overflow:hidden}

.doc:active{transform:scale(.96)}
.pp{position:relative;width:100%;border-radius:12px;overflow:hidden;background-color:#fff;box-shadow:inset 0 0 0 1px #00000014,0 2px 6px #00000012}

.bd{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:4px;padding:3px 8px 3px 6px;border-radius:10px;font:800 10px var(--ff);color:#fff;background:linear-gradient(135deg,#E5584B,#C0392B);box-shadow:0 2px 6px #c0392b66}
.wp{position:absolute;inset:0;display:grid;place-items:center;color:#c0392b44}

.fold:active{transform:scale(.96)}

.fold .bk::before{content:'';position:absolute;top:-12px;left:0;width:46%;height:22px;border-radius:12px 12px 0 0;background:inherit}
.fold .mini{position:absolute;bottom:36px;left:50%;width:min(44%,76px);aspect-ratio:3/4;border-radius:6px;background-color:#fff;background-size:cover;background-position:top;box-shadow:0 2px 8px #0003,inset 0 0 0 1px #0001;transform-origin:50% 100%;transition:transform .5s var(--sp)}
.fold .p0{transform:translateX(-96%) rotate(-10deg)}.fold .p1{transform:translateX(-50%) translateY(-6px) rotate(1deg)}.fold .p2{transform:translateX(-4%) rotate(10deg)}
.fold:hover .p0{transform:translateX(-100%) translateY(-8px) rotate(-14deg)}.fold:hover .p1{transform:translateX(-50%) translateY(-14px) rotate(2deg)}.fold:hover .p2{transform:translateX(0) translateY(-8px) rotate(14deg)}
.fold .mini.sf{aspect-ratio:4/3;width:min(50%,84px);background:color-mix(in srgb,var(--sc) 72%,#000);border-radius:4px 10px 10px 10px;box-shadow:0 2px 8px #0003,inset 0 0 0 1px #0002}.fold .mini.sf::before{content:'';position:absolute;top:-6px;left:0;width:46%;height:9px;border-radius:6px 6px 0 0;background:inherit}.fold .mini.sf::after{content:'';position:absolute;left:0;right:0;bottom:0;height:78%;border-radius:4px 9px 9px 9px;background:linear-gradient(165deg,color-mix(in srgb,var(--sc) 86%,#fff),var(--sc));box-shadow:inset 0 1px 0 #fff6}.fold .fr{position:absolute;left:0;right:0;bottom:0;height:76%;border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(165deg,color-mix(in srgb,var(--c) 86%,#fff),var(--c));box-shadow:0 -3px 12px #0000002e,inset 0 1px 0 #ffffff66}

.empty{text-align:center;color:var(--mu);padding:40px 0}.empty .ei{display:block;width:92px;height:92px;margin:0 auto 18px;border-radius:26px;box-shadow:var(--sh)}.empty p{margin:0 auto;max-width:300px;line-height:1.5}

/* sheets */
#modal{position:fixed;inset:0;background:#0000006b;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:20}

.sheet{width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--sf);border-radius:32px 32px 0 0;padding:14px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #0003;animation:up .5s var(--sp)}
#modal.out .sheet{animation:none;transform:translateY(100%);transition:transform .22s cubic-bezier(.5,0,.8,.5)}
.gr{width:40px;height:5px;border-radius:3px;background:var(--ol);margin:0 auto 16px;position:relative}.gr::before{content:'';position:absolute;inset:-16px -40px}

.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}

.opt.on{border-color:var(--pr);color:var(--pr);background:color-mix(in srgb,var(--pr) 10%,var(--sf))}
.opt .rs{display:block;border-radius:3px;border:2px solid currentColor}
.sw{width:38px;height:38px;border-radius:19px;border:2px solid #0000001a;box-shadow:inset 0 1px 0 #ffffff55}.sw.on{outline:3px solid var(--pr);outline-offset:2px;transform:scale(1.08)}.sw.rb{position:relative;overflow:hidden;display:inline-block;box-sizing:border-box;aspect-ratio:1;padding:0;border-radius:50%!important;border:1px solid rgba(255,255,255,.4)!important;background:conic-gradient(from 200deg,#FF5D5D,#FFA94D,#F2E55C,#55DD7E,#4FD9DC,#5B9DFF,#A97DFF,#FF7FBB,#FF5D5D)}.sw.rb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;border-radius:50%}.sw.rb.on::after{content:'';position:absolute;inset:30%;border-radius:50%;background:var(--cc);box-shadow:0 0 0 1.5px #fff}
.btn{height:50px;border-radius:25px;padding:0 24px;background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px color-mix(in srgb,var(--pr) 38%,transparent)}
.btn.g{background:var(--sa);color:var(--tx);box-shadow:none}.btn.d{background:linear-gradient(135deg,#E5584B,var(--dg));color:#fff;box-shadow:0 8px 20px #e5584b44}
.in{width:100%;height:50px;border-radius:16px;border:2px solid transparent;background:var(--sa);color:var(--tx);padding:0 16px;font:inherit;outline:0;transition:border-color .2s,background .2s}.in:focus{border-color:var(--pr);background:var(--sf)}
.ir{display:flex;align-items:center;gap:10px}.bub{width:50px;height:50px;border-radius:17px;flex:none;display:grid;place-items:center;color:#fff;transition:background .3s}
.pvbox{display:grid;place-items:center;padding:18px;margin-bottom:12px;border-radius:24px;background:var(--desk);min-height:250px}
.prev{border-radius:5px;box-shadow:0 12px 30px #0000003d,0 0 0 1px #0000001a;transition:width .45s var(--sp),height .45s var(--sp),background-color .25s}
.lb{display:flex;align-items:center;gap:7px;margin:12px 0 4px;font:700 13px var(--ff);color:var(--mu)}.lb svg{width:18px;height:18px;color:var(--pr)}
.rw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;border-bottom:1px solid color-mix(in srgb,var(--ol) 60%,transparent)}
.rl{display:flex;align-items:center;gap:12px;font-weight:600}.rb{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--pr) 14%,transparent);color:var(--pr);flex:none}
.about{display:flex;gap:14px;align-items:center;margin:18px 0 4px;padding:16px;border-radius:24px;background:linear-gradient(135deg,color-mix(in srgb,var(--pr) 16%,var(--sf)),var(--sa))}.about p{margin:4px 0 0;font-size:13px;color:var(--mu)}
.vc{margin:10px 0;padding:14px 16px;border-radius:20px;background:var(--sa)}.vc b{font-size:15px}.vc p{margin:6px 0 0;font-size:13.5px;line-height:1.5;color:var(--mu)}
.nw{margin-left:8px;padding:2px 8px;border-radius:9px;font:800 10px var(--ff);background:var(--pr);color:#fff;vertical-align:2px}
.tg{width:51px;height:31px;border-radius:16px;background:var(--ol);position:relative;transition:background .25s;flex:none}.tg::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0004;transition:transform .3s var(--sp)}.tg.on{background:#34C759}.tg.on::after{transform:translateX(20px)}
#snack{position:fixed;left:16px;right:16px;bottom:104px;max-width:520px;margin:auto;background:var(--tx);color:var(--bg);border-radius:20px;padding:12px 16px;display:none;justify-content:space-between;align-items:center;z-index:30;box-shadow:var(--sh2)}#snack.on{display:flex;animation:up .4s var(--sp)}#snack button{color:#E2A93B;font-weight:800}
/* editor */
#ed{position:fixed;inset:0;background:var(--bg);user-select:none;-webkit-user-select:none}
#top,#tools,#pop,#bar,#pgi{background:var(--gl);-webkit-backdrop-filter:saturate(1.6) blur(22px);backdrop-filter:saturate(1.6) blur(22px)}
#top{position:absolute;top:0;left:0;right:0;height:calc(52px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:2px;padding-inline:6px;border-bottom:1px solid color-mix(in srgb,var(--ol) 60%,transparent);box-shadow:0 6px 22px #00000012;z-index:6}
#top .ib{width:44px;height:44px;border-radius:22px}#top .ib:disabled{opacity:.3}#top .ib:active{background:var(--sa)}
#ttl{flex:1;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px 10px;border-radius:14px;text-align:center}#ttl:active{background:var(--sa)}
#stage{position:absolute;top:calc(52px + env(safe-area-inset-top));bottom:0;left:0;right:0;background:var(--desk);overflow:hidden;touch-action:none}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}

.ob{position:absolute;transform-origin:50% 50%;pointer-events:none;font-family:var(--ff);line-height:1.3}

.ob.note textarea{height:100%}

#pgi{position:absolute;top:calc(62px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-8px);padding:6px 14px;border-radius:16px;font:800 13px var(--ff);box-shadow:var(--sh);opacity:0;pointer-events:none;transition:opacity .25s,transform .4s var(--sp);z-index:5}#pgi.on{opacity:1;transform:translate(-50%,0)}

#tools .ib.on svg path,#tools .ib.on svg rect,#tools .ib.on svg circle{fill:currentColor;fill-opacity:.22}
.dot{position:absolute;bottom:3px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;box-shadow:0 0 0 2px var(--sf)}
#pop,#bar{position:absolute;left:12px;right:12px;display:none;border:1px solid color-mix(in srgb,var(--ol) 70%,transparent);border-radius:28px;padding:14px;z-index:7;box-shadow:0 12px 34px #0000002b}
#pop.on,#bar.on{display:block;animation:up .35s var(--sp)}#pop{bottom:calc(84px + env(safe-area-inset-bottom));max-width:380px;margin:auto}
#bar{bottom:calc(84px + env(safe-area-inset-bottom));display:none;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}#bar.on{display:flex}
.bt{width:42px;height:42px;border-radius:21px;background:var(--sa);display:grid;place-items:center}.bt.del{color:var(--dg)}#bar .op{color:var(--mu)}
.pv{width:100%;height:44px;background:var(--bg);border-radius:14px;margin-bottom:8px}
.sz{width:44px;height:44px;border-radius:14px;background:var(--sa);display:grid;place-items:center}.sz i{display:block;border-radius:50%;box-shadow:0 0 0 1px #0002}.sz.on{outline:2px solid var(--pr);background:color-mix(in srgb,var(--pr) 14%,transparent)}
input[type=color]{width:100%;height:40px;border:0;border-radius:12px;padding:0;background:none;margin-top:6px}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0;border-radius:12px}

#ed:not([hidden]){animation:edin .45s var(--ez)}@keyframes edin{from{opacity:0;transform:translateY(28px) scale(.97)}}
#home:not([hidden]){animation:hmin .42s var(--ez)}@keyframes hmin{from{opacity:0;transform:scale(1.025)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body::before{display:none!important}.lg{display:none}
.bd{background:#C0463B!important;box-shadow:none!important}
.fold .fr{background:var(--c)!important;box-shadow:none!important}.fold .mini.sf::after{background:var(--sc)!important;box-shadow:none!important}
.fab{background:var(--pr)!important;box-shadow:0 6px 18px #0000002e!important}

  h('div',{class:'lb',innerHTML:ic('spk',18)+'Có gì mới'}),
  vc('1.15.0',['Giao diện Xám nay là xám thật, tối và trung tính, giữ màu nhấn cam đặc trưng của ứng dụng; bỏ các màu xám pha màu.','Kéo thả để di chuyển: đè vào một mục rồi kéo vào thư mục để chuyển vào, thả lên nút quay lại để đưa ra ngoài; dùng một ngón khác vuốt lên xuống để cuộn khi danh sách dài.','Sắp xếp file riêng cho từng nơi: Mới nhất, Cũ nhất, Tên A–Z hoặc Tự do (kéo thả đặt vị trí tùy ý).','Nhấn vào tên của trang, PDF hoặc thư mục để đổi tên ngay tại chỗ; menu ba chấm chỉ còn Xóa.','Thư mục: các thư mục con lấp ló nghiêng bên trái, tối đa 3; khi thu nhỏ lưới hết cỡ hiện tới 5 trang xem trước.','Thêm Ảnh trong menu tạo mới: nhận mọi tỉ lệ và định dạng, vẽ, tô sáng, chữ, ghi chú; ảnh dài kéo núm ở mép dưới để chỉnh độ dài.']),
  vc('1.14.0',['Cài đặt: thêm Ảnh nền cho màn hình chính (có thanh chỉnh độ phủ màu giao diện), Cỡ chữ khi gõ, Giấy note mở sẵn chế độ gõ chữ, Sắp xếp màn hình chính, Tắt animation, Giữ màn hình sáng khi đang viết.','Đổi tên mục chống chạm nhầm bằng tay cho dễ hiểu; Rung có biểu tượng gạch chéo khi tắt; bỏ mục Khóa trang vì đã có nút khóa trên thanh trên cùng.','Giấy note có thêm màu sáng lẫn tối và chọn màu tùy ý; chữ trong giấy note lớn hơn và trải rộng theo bề ngang giấy.']),
  vc('1.13.0',['Làm lại menu tạo mới: thẻ có hình minh họa, hiện lần lượt với hiệu ứng nảy, màu theo giao diện.','Thêm Giấy note: trang chỉ gõ chữ và thêm ảnh, không vẽ; chọn màu giấy, kích thước và kẻ ngang hoặc ô vuông, màu giấy gợi ý đổi theo giao diện sáng hoặc tối.','Sửa ảnh xem trước ở màn hình chính: nay hiện cả sơ đồ tư duy, chữ, ghi chú và ảnh, và được cập nhật mỗi lần lưu.','Vào PDF hoặc trang luôn mở sẵn chế độ Con trỏ với thanh công cụ thu gọn; chạm vào nút Con trỏ để mở rộng như trước.']),
  vc('1.12.0',['Viết lại bộ dựng PDF cho tệp dài và nặng: chỉ dựng trang đang xem cùng vài trang liền kề theo hướng cuộn, trang gần giữa màn hình được ưu tiên.','Cuộn nhanh thì hoãn dựng; trang đã trôi xa bị hủy ngay để nhường tài nguyên.','Giữ ảnh thu nhỏ của các trang đã xem để hiện ngay khi cuộn lại; bộ nhớ được giải phóng theo khoảng cách tới màn hình.','Dọn bộ nhớ của bộ đọc PDF định kỳ và tự nạp lại tài liệu khi bộ đọc ngừng phản hồi, nên cuộn xa trong tệp hàng trăm trang vẫn tải tiếp.','Lưu kích thước các trang ở lần mở đầu tiên nên các lần mở sau vào ngay; giảm bộ nhớ tạm khi nhập tệp PDF lớn.','Dịch vụ nền lưu sẵn thư viện đọc PDF để dùng được khi không có mạng.']),
  vc('1.11.0',['Thêm hoạt ảnh cho các thao tác trước đây chưa có: hộp chữ, ảnh, ghi chú và nút sơ đồ xuất hiện bằng hiệu ứng bật lên; xóa đối tượng thu nhỏ rồi mờ đi.','Mũi tên sơ đồ tư duy được vẽ dần từ nút nguồn sang nút đích khi tạo.','Mở rộng và thu gọn các mục ở màn hình chính có hiệu ứng trượt xuống; chụm đổi cỡ lưới có hiệu ứng nhún; xóa trang thu nhỏ trước khi biến mất.','Đổi giao diện chuyển màu mượt thay vì đổi ngay; nội dung bảng chọn lần lượt hiện ra; chọn màu và biểu tượng có hiệu ứng nảy.','Thanh công cụ mở rộng từ chế độ con trỏ có các nút bật lên lần lượt; nút hoàn tác, làm lại, vừa khung và khóa trang có phản hồi khi chạm.']),
  vc('1.10.0',['Thay hoạt ảnh mở đầu bằng bản mới dùng biểu tượng ứng dụng: biểu tượng lắp ráp, tờ giấy được rút ra và viết nét bút, chữ NOTERI hiện lên rồi màn hình thu về dạng vòng tròn.','Hoạt ảnh bắt đầu sau khi phông Google Sans tải xong (chờ tối đa 0,7 giây); chạm vào màn hình để bỏ qua.']),
  vc('1.9.0',['Toàn bộ ứng dụng dùng phông Google Sans, nhúng sẵn trong ứng dụng nên vẫn chạy khi không có mạng; hỗ trợ đầy đủ tiếng Việt.','Chữ trong trang (hộp chữ, ghi chú, nút sơ đồ, tên nhóm) dùng cùng phông; vị trí hít chữ vào dòng kẻ được tính theo đúng số đo của phông.','Thanh công cụ có hiệu ứng khi chọn Con trỏ: các nút thu dần về nút Con trỏ, mở rộng lại thì lần lượt hiện ra.']),
  vc('1.8.0',['Mũi tên sơ đồ tư duy: nét mảnh hơn, đầu mũi tên nhỏ gọn theo độ dày, góc của đường gấp khúc được bo tròn.','Chỉnh độ dày mũi tên: chọn một mũi tên để dùng thanh trượt; bảng Sơ đồ tư duy đặt độ dày mặc định cho mũi tên mới.','Nhóm: kéo một nút vào trong nút khác sẽ có gợi ý nhóm, thả tay để tạo nhóm rồi đặt tên. Nhóm hiện khung mờ bao quanh, tên nằm phía trên.','Kéo viền hoặc tên nhóm để di chuyển cả nhóm; nhấn đúp vào tên để đổi tên; kéo tay nắm góc dưới phải để đổi kích thước.','Hộp chữ, ghi chú, nút sơ đồ và tên nhóm đều cần nhấn đúp để sửa chữ; chạm một lần chỉ chọn.','Công cụ Chữ có nút hít chữ vào dòng kẻ ngang: bật thì chữ nằm trên đường kẻ của trang (kẻ ngang hoặc ô vuông), hít nhẹ và tức thì; tắt thì như cũ.']),
  vc('1.7.1',['Sửa lệch vùng tô sáng của công cụ đang chọn trên thanh công cụ; các nút có kích thước đồng đều.','Chọn công cụ Con trỏ thu thanh công cụ còn một nút ở giữa; chạm lại nút đó để mở rộng.','Đóng bàn phím hoặc thoát khi đang tạo nút sơ đồ hoặc hộp chữ mà chưa nhập gì thì hủy việc tạo đó.','Khi bảng bút, tẩy hoặc sơ đồ tư duy đang mở, chạm vào trang chỉ đóng bảng, không tạo nét vẽ.']),
  vc('1.7.0',['Thêm công cụ Sơ đồ tư duy trên thanh công cụ; nhấn lần nữa hoặc giữ nút để mở bảng chế độ.','Nút sơ đồ: kéo di chuyển, đổi độ rộng, đổi màu, nhân bản, xóa; chiều cao tự co theo nội dung.','Mũi tên nối nút: đường cong, thẳng hoặc gấp khúc; bật tắt đầu mũi tên; tự bám theo khi di chuyển nút.','Thêm nút con bằng dấu cộng ở bốn cạnh nút; kéo từ dấu cộng sang nút khác để nối, kéo ra chỗ trống để tạo nút mới và nối.','Chế độ Nối nút: kéo trực tiếp từ nút này sang nút khác.','Sắp xếp tự động dạng cây từ trái sang phải.','Sơ đồ dùng chung lịch sử Hoàn tác và lưu cùng trang, cùng bút vẽ, chữ, ảnh.','Viết lại mục Giới thiệu và Có gì mới theo dạng liệt kê; thêm README.md cho người bảo trì.']),
  vc('1.6.0',['Thêm hiệu ứng mở đầu khi khởi động ứng dụng.','Nút quay lại của điện thoại lùi từng cấp thư mục; thoát ứng dụng khi đang ở trang chủ.','Thêm 10 màu giao diện trong mục Thêm; bỏ chế độ Theo máy.','Chọn biểu tượng cho thư mục từ 56 biểu tượng; kích thước biểu tượng thay đổi theo mức zoom lưới.','Điều chỉnh bố cục khi xoay ngang và trên màn hình dài: thanh công cụ gọn hơn, lưới tự thêm cột, tránh vùng tai thỏ.']),
  vc('1.5.0',['Màn hình trống dùng biểu tượng ứng dụng và lời nhắn ngắn gọn.','Sửa ảnh xem trước trong thẻ thư mục bị nhô cao ở chế độ 1 cột.','Khóa trang khi xem PDF: cuộn thẳng, chỉ nhích ngang nhẹ rồi thu về giữa; không hiện thông báo khi bật.','Nhấn đúp hoặc nút vừa khung chỉ đưa zoom về mặc định, giữ nguyên vị trí đang xem; xoay máy không đưa PDF về trang đầu.']),
  vc('1.4.0',['Thư mục lồng nhau.','Thu gọn hoặc mở rộng các mục ở màn hình chính.','Chụm hai ngón để đổi kích cỡ lưới từ 1 đến 5 cột; mỗi thư mục lưu mức riêng.','Thêm nút khóa trang vào giữa khi xem PDF.','Giới hạn kéo trang tính theo kích thước trang, đồng đều ở mọi mức zoom.','Bỏ mục Gần đây; bỏ gradient và hiệu ứng phát sáng.']),
  vc('1.3.0',['Thiết kế lại giao diện: bo góc, nền kính mờ, chuyển cảnh mượt hơn, nhiều nút chuyển sang biểu tượng.','Màn hình chính: thư mục có ảnh xem trước, lưới trang và PDF đúng tỉ lệ, bộ lọc Tất cả, Trang, PDF.','Cải thiện viết tay: chống chạm nhầm lòng bàn tay, thanh Độ mượt nét, chọn nhanh cỡ nét, chỉ số trang khi cuộn PDF.','Giới hạn thu nhỏ PDF cố định; xem trước trang mới hiển thị đúng kẻ ngang và ô vuông.']),
  vc('1.2.0',['Tối ưu hiệu năng: nét vẽ được cache khi có nhiều nét, kéo có quán tính, PDF tải và dựng nhẹ hơn.','Trang và PDF tự hít vào giữa khi thả tay gần giữa (có thể tắt).','Công tắc kiểu iOS; ảnh xem trước thật cho từng trang.']),
  vc('1.1.0',['Trang mở ra ở giữa màn hình; giới hạn zoom tính theo mức vừa khung; zoom bám đúng điểm giữa hai ngón.','Hai ngón luôn zoom được với mọi công cụ.','Ảnh: di chuyển, đổi cỡ, xoay; công cụ Chữ tạo hộp chữ tại điểm chạm.','Chỉ còn hai bút: Bút và Bút dạ.','PDF cuộn liên tục, cho phép vẽ ngoài lề trang, nét vẽ gắn cố định với trang PDF.']),
  vc('1.0.0',['Phát hành đầu tiên: thư mục, trang, vẽ, tẩy, ghi chú dán, nhập PDF.']));rs();modal(h('h2',{textContent:'Cài đặt'}),b)}
