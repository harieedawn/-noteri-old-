<style>

.fold:hover .p0{transform:translateX(-100%) translateY(-8px) rotate(-14deg)}.fold:hover .p1{transform:translateX(-50%) translateY(-14px) rotate(2deg)}.fold:hover .p2{transform:translateX(0) translateY(-8px) rotate(14deg)}

.opt .rs{display:block;border-radius:3px;border:2px solid currentColor}

.btn{height:50px;border-radius:25px;padding:0 24px;background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px color-mix(in srgb,var(--pr) 38%,transparent)}
.btn.g{background:var(--sa);color:var(--tx);box-shadow:none}.btn.d{background:linear-gradient(135deg,#E5584B,var(--dg));color:#fff;box-shadow:0 8px 20px #e5584b44}
.in{width:100%;height:50px;border-radius:16px;border:2px solid transparent;background:var(--sa);color:var(--tx);padding:0 16px;font:inherit;outline:0;transition:border-color .2s,background .2s}.in:focus{border-color:var(--pr);background:var(--sf)}
.ir{display:flex;align-items:center;gap:10px}.bub{width:50px;height:50px;border-radius:17px;flex:none;display:grid;place-items:center;color:#fff;transition:background .3s}
.pvbox{display:grid;place-items:center;padding:18px;margin-bottom:12px;border-radius:24px;background:var(--desk);min-height:250px}
.prev{border-radius:5px;box-shadow:0 12px 30px #0000003d,0 0 0 1px #0000001a;transition:width .45s var(--sp),height .45s var(--sp),background-color .25s}
.lb{display:flex;align-items:center;gap:7px;margin:12px 0 4px;font:700 13px system-ui;color:var(--mu)}.lb svg{width:18px;height:18px;color:var(--pr)}
.rw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;border-bottom:1px solid color-mix(in srgb,var(--ol) 60%,transparent)}
.rl{display:flex;align-items:center;gap:12px;font-weight:600}.rb{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--pr) 14%,transparent);color:var(--pr);flex:none}
.about{display:flex;gap:14px;align-items:center;margin:18px 0 4px;padding:16px;border-radius:24px;background:linear-gradient(135deg,color-mix(in srgb,var(--pr) 16%,var(--sf)),var(--sa))}.about p{margin:4px 0 0;font-size:13px;color:var(--mu)}
.vc{margin:10px 0;padding:14px 16px;border-radius:20px;background:var(--sa)}.vc b{font-size:15px}.vc p{margin:6px 0 0;font-size:13.5px;line-height:1.5;color:var(--mu)}
.nw{margin-left:8px;padding:2px 8px;border-radius:9px;font:800 10px system-ui;background:var(--pr);color:#fff;vertical-align:2px}
.tg{width:51px;height:31px;border-radius:16px;background:var(--ol);position:relative;transition:background .25s;flex:none}.tg::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0004;transition:transform .3s var(--sp)}.tg.on{background:#34C759}.tg.on::after{transform:translateX(20px)}
#snack{position:fixed;left:16px;right:16px;bottom:104px;max-width:520px;margin:auto;background:var(--tx);color:var(--bg);border-radius:20px;padding:12px 16px;display:none;justify-content:space-between;align-items:center;z-index:30;box-shadow:var(--sh2)}#snack.on{display:flex;animation:up .4s var(--sp)}#snack button{color:#E2A93B;font-weight:800}
/* editor */
#ed{position:fixed;inset:0;background:var(--bg);user-select:none;-webkit-user-select:none}
#top,#tools,#pop,#bar,#pgi{background:var(--gl);-webkit-backdrop-filter:saturate(1.6) blur(22px);backdrop-filter:saturate(1.6) blur(22px)}
#top{position:absolute;top:0;left:0;right:0;height:calc(52px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:2px;padding-inline:6px;border-bottom:1px solid color-mix(in srgb,var(--ol) 60%,transparent);box-shadow:0 6px 22px #00000012;z-index:6}
#top .ib{width:44px;height:44px;border-radius:22px}#top .ib:disabled{opacity:.3}#top .ib:active{background:var(--sa)}
#ttl{flex:1;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px 10px;border-radius:14px;text-align:center}#ttl:active{background:var(--sa)}

.ob.note textarea{height:100%}

#pgi{position:absolute;top:calc(62px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-8px);padding:6px 14px;border-radius:16px;font:800 13px system-ui;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:opacity .25s,transform .4s var(--sp);z-index:5}#pgi.on{opacity:1;transform:translate(-50%,0)}

#pop.on,#bar.on{display:block;animation:up .35s var(--sp)}#pop{bottom:calc(84px + env(safe-area-inset-bottom));max-width:380px;margin:auto}

.bt{width:42px;height:42px;border-radius:21px;background:var(--sa);display:grid;place-items:center}.bt.del{color:var(--dg)}#bar .op{color:var(--mu)}
.pv{width:100%;height:44px;background:var(--bg);border-radius:14px;margin-bottom:8px}
.sz{width:44px;height:44px;border-radius:14px;background:var(--sa);display:grid;place-items:center}.sz i{display:block;border-radius:50%;box-shadow:0 0 0 1px #0002}.sz.on{outline:2px solid var(--pr);background:color-mix(in srgb,var(--pr) 14%,transparent)}
input[type=color]{width:100%;height:40px;border:0;border-radius:12px;padding:0;background:none;margin-top:6px}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0;border-radius:12px}

#ed:not([hidden]){animation:edin .45s var(--ez)}@keyframes edin{from{opacity:0;transform:translateY(28px) scale(.97)}}

.bd{background:#C0463B!important;box-shadow:none!important}

.fab{background:var(--pr)!important;box-shadow:0 6px 18px #0000002e!important}

.btn{background:var(--pr)!important;box-shadow:none!important}.btn.g{background:var(--sa)!important}.btn.d{background:var(--dg)!important}

.sec.cl{cursor:pointer;-webkit-user-select:none;user-select:none}.chv{display:grid;place-items:center;width:30px;height:30px;border-radius:15px;background:var(--sa);margin-left:auto;flex:none;transition:transform .35s var(--sp)}.seg~.chv{margin-left:8px}.chv svg{transform:rotate(-90deg)}.sec.c .chv svg{transform:rotate(180deg)}
